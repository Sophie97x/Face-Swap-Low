name: Security checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Verify the launcher rejects Python 3.10
        if: matrix.python == '3.10'
        run: |
          python -m venv LiveFaceSwap/.venv
          if bash LiveFaceSwap/run.sh > "$RUNNER_TEMP/launcher.log" 2>&1; then exit 1; fi
          grep -F 'requires Python 3.11' "$RUNNER_TEMP/launcher.log"
      - if: matrix.python == '3.11'
        run: python -m pip install -r LiveFaceSwap/requirements.txt
      - if: matrix.python == '3.11'
        run: python -m unittest discover -s tests -v
      - if: matrix.python == '3.11'
        run: python -m compileall -q LiveFaceSwap -x '/.venv/'
